<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Thali — Daily Food Tracker</title>
  <meta name="description" content="Indian-first daily food tracker. Log breakfast, lunch, snacks and dinner with quantities and timings." />
  <meta name="theme-color" content="#070812" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thali" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="grid-floor" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">THALI</span>
      </div>
      <div class="topbar-right">
        <span class="pill pill-offline" id="offlinePill" hidden>● Offline</span>
        <span class="pill pill-streak" id="streakPill" hidden></span>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="dock" aria-label="Primary">
    <a href="#/today" class="dock-btn" data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg><span>Today</span>
    </a>
    <a href="#/library" class="dock-btn" data-tab="library" aria-label="Food library">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Foods</span>
    </a>
    <button class="dock-fab" id="fab" aria-label="Add food">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#/insights" class="dock-btn" data-tab="insights" aria-label="Insights">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Insights</span>
    </a>
    <a href="#/settings" class="dock-btn" data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span>Me</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Food" hidden>
    <div class="sheet-grip" id="grip"><i></i></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
